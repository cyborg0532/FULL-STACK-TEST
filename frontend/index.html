<!DOCTYPE html>
<html lang="en">
<head>
  <title>API Native Tester</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 font-sans">

  <div class="max-w-md mx-auto space-y-6">

    <div class="bg-gray-800 p-5 rounded-lg shadow">
      <h2 class="font-bold text-lg mb-3 text-indigo-400">Create Profile (POST)</h2>
      
      <form action="http://localhost:3000/api/profiles" method="POST" class="space-y-3">
        <input type="text" name="name" placeholder="Name" required class="w-full bg-gray-900 p-2 border border-gray-700 rounded">
        <input type="email" name="email" placeholder="Email" required class="w-full bg-gray-900 p-2 border border-gray-700 rounded">
        <input type="text" name="phone" placeholder="Phone" required class="w-full bg-gray-900 p-2 border border-gray-700 rounded">
        <input type="number" name="age" placeholder="Age" required class="w-full bg-gray-900 p-2 border border-gray-700 rounded">
        <textarea name="address" placeholder="Address" required class="w-full bg-gray-900 p-2 border border-gray-700 rounded"></textarea>
        
        <button type="submit" class="w-full bg-emerald-600 p-2 rounded font-bold hover:bg-emerald-500 transition-colors">
          Submit POST Request
        </button>
      </form>
    </div>

    <div class="bg-gray-800/50 p-4 rounded border border-gray-700 text-xs text-gray-400">
      
    </div>

  </div>

</body>
</html>
